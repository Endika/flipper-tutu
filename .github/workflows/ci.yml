name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update && sudo apt-get install -y build-essential cppcheck clang-format
      - name: Linter
        run: make linter
      - name: Format check
        run: git ls-files '*.c' '*.h' | grep -v 'levels_data\.h' | xargs clang-format --dry-run --Werror
      - name: Host tests
        run: make test
      - name: Bank header in sync with levels.json
        run: |
          node tools/gen-levels-header.mjs
          git diff --exit-code src/data/levels_data.h
      # The .fap is the only gate that compiles main.c, src/app/tutu_app.c and
      # src/platform/storage_port.c: they need the firmware's furi headers, so gcc never
      # sees them and cppcheck was their only reader. Last in the job, so the fast gates
      # above still fail first.
      - name: Build FAP
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.4
        with:
          # Stable released firmware API, matching the release build — a dev-channel build
          # targets a newer API than stable firmware provides.
          sdk-channel: release
